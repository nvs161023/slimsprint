<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Редакционная иллюстрация свежего сбалансированного блюда на керамической тарелке">
<title>Свежие продукты и готовое блюдо</title>
<defs>
 <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f2e7"/><stop offset="1" stop-color="#e7eadb"/></linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e9e3d6"/></linearGradient>
 <linearGradient id="food" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9c28f"/><stop offset="1" stop-color="#bda16e"/></linearGradient>
 <linearGradient id="chicken" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f2c99a"/><stop offset="1" stop-color="#bd8053"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78986b"/><stop offset="1" stop-color="#385d40"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="800" height="800" rx="54" fill="url(#scene)"/>
